services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sap-rag-backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./backend/documents:/app/documents
      - ./backend/chroma_data:/app/chroma_data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sap-rag-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes: {}

networks:
  default:
    name: sap-rag-network
